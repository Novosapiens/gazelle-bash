name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
      # Fails if regenerating the fixtures would change any committed BUILD.bazel.
      - run: bazel run //:gazelle.check || { echo "BUILD files are stale. Run: bazel run //:gazelle"; exit 1; }
      # Runs the generated targets in the sandbox: proves declared deps are complete.
      - run: bazel test //...
