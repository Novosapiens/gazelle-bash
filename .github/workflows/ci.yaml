name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
      # Fails if regenerating the fixtures would change any committed BUILD.bazel.
      - run: |
          bazel run //:gazelle.check || { echo "BUILD files are stale. Run: bazel run //:gazelle"; exit 1; }
      # Runs the generated targets in the sandbox: proves declared deps are complete.
      - run: bazel test //...

  # Takes a host repo in create mode through a folder being added, renamed, deleted and
  # excluded, with gazelle.check and bazel build after each step.
  lifecycle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
      - run: bazel run //tests/lifecycle:run

  # Runs the plugin on real open-source shell projects pinned in tests/corpus/projects.txt.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
      - run: tests/corpus/run.sh
