name: Release

# Tags a release when main gets a new version: a PR that changes `version` in MODULE.bazel is
# released as v<version> once it merges, with its description as the release notes. A push that
# leaves the version alone (its tag exists) does nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The version of the module() call: its first `version = "..."` line.
          version=$(awk '/^module\(/ { in_module = 1 }
            in_module && /^[[:space:]]*version[[:space:]]*=/ { split($0, part, "\""); print part[2]; exit }
            in_module && /^\)/ { exit }' MODULE.bazel)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release: no x.y.z version in MODULE.bazel's module() (got '${version}')" >&2
            exit 1
          fi
          tag="v${version}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} is already tagged: nothing to release."
            exit 0
          fi
          # The squash commit's message is the PR's description.
          git log -1 --format=%b "${GITHUB_SHA}" > "${RUNNER_TEMP}/notes.md"
          if grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes.md"; then
            gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
          fi
          echo "Released ${tag} at ${GITHUB_SHA}."
